name: CI

on:
  push:
  pull_request:

jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff lint and formatting checks
        run: |
          ruff check app.py src tests scripts
          ruff format --check app.py src tests scripts
      - name: Run mypy
        run: mypy src/aws_cost_dashboard
